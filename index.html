<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratório de Parafusos — Radical Motos</title>
<style>

  :root{
    --rm-bg: #f0f0f0;
    --rm-panel: #ffffff;
    --rm-panel-2: #f4f3f1;
    --rm-border: #ddd9d1;
    --rm-text: #232220;
    --rm-text-dim: #767268;
    --rm-accent: #d9433a;
    --rm-accent-ink: #ffffff;
    --rm-teal: #3fb8af;
    --rm-red: #d9534f;
    --rm-green: #4caf7d;
    --rm-shadow: 0 1px 2px rgba(30,25,15,0.04), 0 4px 16px rgba(30,25,15,0.06);
    --rm-shadow-sm: 0 1px 3px rgba(30,25,15,0.06);
    --rm-font-display: 'Oswald', sans-serif;
    --rm-font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--rm-bg);
    color: var(--rm-text);
    font-family: var(--rm-font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #rm-app{max-width:none;margin:0 auto;padding:0 0 48px;}

  .rm-header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:10px;
    padding:18px 20px; border-bottom:1px solid var(--rm-border);
    position:sticky; top:0; background:var(--rm-bg); z-index:20;
  }
  .rm-brand{display:flex; align-items:center; gap:10px;}
  .rm-brand-mark{
    width:14px;height:14px;border-radius:2px;
    background: repeating-linear-gradient(45deg, var(--rm-accent) 0 6px, #1c1300 6px 12px);
    flex-shrink:0;
  }


  .rm-nav{
    display:flex; gap:2px; align-items:center; background:var(--rm-panel-2);
    border:1px solid var(--rm-border); border-radius:10px; padding:3px;
    overflow-x:auto; max-width:100%;
  }
  .rm-header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .rm-sync-status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--rm-text-dim);}
  .rm-sync-dot{width:8px; height:8px; border-radius:50%; background:var(--rm-green); flex-shrink:0;}
  .rm-sync-dot.rm-sync-offline{background:var(--rm-red);}
  .rm-settings-wrap{position:relative;}



  .rm-sidebar-toggle svg, .rm-sidebar-expand svg{width:18px; height:18px; fill:currentColor; display:block;}
  .rm-settings-menu{
    display:none; position:absolute; top:44px; right:0; background:var(--rm-panel);
    border:1px solid var(--rm-border); border-radius:9px; padding:6px; min-width:180px;
    box-shadow:0 8px 20px rgba(0,0,0,0.12); z-index:30; flex-direction:column; gap:2px;
  }
  .rm-settings-menu.show{display:flex;}




  .rm-nav-btn{
    font-family:var(--rm-font-body); font-size:13px; font-weight:600;
    background:transparent; color:var(--rm-text-dim); border:none;
    padding:8px 14px; border-radius:7px; cursor:pointer; transition:all .15s ease;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .rm-nav-icon{font-size:13px; line-height:1; opacity:0.85; display:flex;}
  .rm-nav-icon svg{width:18px; height:18px; fill:currentColor; display:block;}
  .rm-nav-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.35;}
  .rm-nav-sub{display:none; font-size:11px; font-weight:500; color:var(--rm-text-dim);}
  .rm-nav-btn.active{background:var(--rm-panel); color:var(--rm-accent); box-shadow:0 1px 4px rgba(0,0,0,0.1);}
  .rm-nav-btn.active .rm-nav-icon{opacity:1;}
  .rm-nav-btn:hover:not(.active){color:var(--rm-text);}
  .rm-sidebar-toggle{display:none;}
  .rm-sidebar-expand{display:none;}

  main{padding:20px;}
  .rm-section{display:none;}
  .rm-section.active{display:block;}

  .rm-foto-preview{margin-top:10px;}
  .rm-foto-thumb{width:100%; max-width:220px; border-radius:9px; display:block; margin-bottom:8px; border:1px solid var(--rm-border);}
  .rm-foto-preview button{
    background:none; border:1px solid var(--rm-border); color:var(--rm-text-dim); border-radius:7px;
    padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .rm-foto-thumb-modal{width:100%; max-width:280px; border-radius:9px; display:block; border:1px solid var(--rm-border); margin-bottom:8px;}

  /* botões Venda/Orçamento e Consumidor/Parceiro: abas com linha vermelha embaixo da escolhida */
  .rm-pdv-modo-toggle{
    display:inline-flex; gap:0; background:transparent; border:0; border-bottom:1px solid var(--rm-border);
    border-radius:0; padding:0; margin-bottom:22px;
  }
  .rm-pdv-modo-btn{
    background:transparent; border:none; border-bottom:3px solid transparent; margin-bottom:-1px; color:var(--rm-text-dim); font-family:var(--rm-font-body);
    font-size:15px; font-weight:700; padding:10px 22px; border-radius:0; cursor:pointer; transition:color .15s, border-color .15s;
  }
  .rm-pdv-modo-btn:hover:not(.active){color:var(--rm-text);}
  .rm-pdv-modo-btn.active{background:transparent; color:var(--rm-text); border-bottom-color:var(--rm-accent); box-shadow:none;}
  .rm-pdv-tag-orcamento{
    display:inline-block; background:var(--rm-panel-2); color:var(--rm-text-dim); font-size:11px;
    font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em;
  }



  /* Barra de adicionar item */
  .rm-pdv-toggles-row{display:flex; gap:28px; flex-wrap:wrap; margin-bottom:22px;}
  .rm-pdv-toggles-row .rm-pdv-modo-toggle{margin-bottom:0;}








  .rm-pdv-add-btn{
    background:var(--rm-accent); color:var(--rm-accent-ink); border:none; border-radius:9px;
    width:47px; height:47px; font-size:22px; font-weight:700; cursor:pointer; flex-shrink:0; line-height:1;
  }
  .rm-pdv-add-btn:hover{filter:brightness(1.05);}

  /* Atalhos de itens frequentes */
  .rm-pdv-atalhos{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .rm-pdv-atalho-btn{
    display:flex; align-items:stretch; background:var(--rm-panel); border:1px solid var(--rm-border);
    border-radius:20px; overflow:hidden; font-size:12.5px;
  }
  .rm-pdv-atalho-btn button{background:none; border:none; cursor:pointer; font-family:var(--rm-font-body);}
  .rm-pdv-atalho-usar{padding:7px 12px; color:var(--rm-text); font-weight:600;}
  .rm-pdv-atalho-usar:hover{color:var(--rm-accent);}
  .rm-pdv-atalho-preco{color:var(--rm-text-dim); font-weight:500; margin-left:5px;}
  .rm-pdv-atalho-remove{padding:7px 10px; color:var(--rm-text-dim); border-left:1px solid var(--rm-border) !important;}
  .rm-pdv-atalho-remove:hover{color:var(--rm-red);}
  .rm-pdv-atalho-add{
    background:none; border:1px dashed var(--rm-border); border-radius:20px; padding:7px 14px;
    font-size:12.5px; font-weight:600; color:var(--rm-text-dim); cursor:pointer;
  }
  .rm-pdv-atalho-add:hover{color:var(--rm-accent); border-color:var(--rm-accent);}

  /* Carrinho — lista simples, sem caixa por item */
  .rm-pdv-cart-list{border-top:1px solid var(--rm-border);}
  .rm-pdv-cart-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px; border-bottom:1px solid var(--rm-border);
  }
  .rm-pdv-cart-item-nome{font-size:14px; font-weight:600;}
  .rm-pdv-cart-item-detalhe{font-size:12px; color:var(--rm-text-dim); margin-top:1px;}

  .rm-pdv-cart-item-subtotal{font-weight:700; font-size:14px;}





  .rm-pdv-hero-lines{
    width:100%; margin-top:12px; padding-top:12px; border-top:1px solid var(--rm-border);
    display:flex; flex-direction:column; gap:6px;
  }
  .rm-pdv-hero-line{display:flex; align-items:center; justify-content:space-between; font-size:14.5px; color:var(--rm-text-dim);}
  .rm-pdv-hero-line b{color:var(--rm-text); font-weight:700; font-size:15px;}
  .rm-pdv-hero-line#rm-pdv-desconto-line.rm-pdv-desconto-ativo b{color:var(--rm-red);}







  .rm-pdv-pagamento-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .rm-pdv-pag-btn{
    background:var(--rm-panel); border:1px solid var(--rm-border); border-radius:9px; padding:12px 10px;
    font-size:13px; font-weight:700; color:var(--rm-text-dim); cursor:pointer; text-align:center;
  }
  .rm-pdv-pag-btn.active{background:var(--rm-accent); color:var(--rm-accent-ink); border-color:var(--rm-accent);}


  #rm-pdv-troco-linha{font-weight:500;}
  #rm-pdv-troco-linha.rm-pdv-troco-ok{color:var(--rm-green); font-weight:700;}
  #rm-pdv-troco-linha.rm-pdv-troco-falta{color:var(--rm-red); font-weight:700; font-size:19px;}

  .rm-pdv-cliente-tag{
    display:flex; align-items:center; justify-content:space-between; background:var(--rm-bg);
    border:1px solid var(--rm-border); border-radius:8px; padding:8px 10px; margin-top:6px; font-size:13px;
  }
  .rm-pdv-cliente-tag button{background:none; border:none; color:var(--rm-text-dim); font-size:16px; cursor:pointer;}

  .rm-pdv-finalizar{
    width:100%; background:var(--rm-accent); color:var(--rm-accent-ink); border:none;
    border-radius:10px; padding:17px; font-size:16px; font-weight:700; font-family:var(--rm-font-body);
    cursor:pointer; letter-spacing:0.01em; margin-top:4px;
  }
  .rm-pdv-finalizar:active{transform:scale(0.99);}

  @media (max-width:900px){


  }
  .rm-subnav{
    display:flex; gap:4px; align-items:stretch; background:var(--rm-panel);
    border:1px solid var(--rm-border); border-radius:12px; padding:8px;
    overflow-x:auto; max-width:100%; margin-bottom:22px; width:fit-content;
  }
  .rm-subnav-btn{
    font-family:var(--rm-font-body); font-size:11.5px; font-weight:700;
    background:transparent; color:var(--rm-text-dim); border:none;
    padding:10px 16px; border-radius:8px; cursor:pointer; transition:all .15s ease; white-space:nowrap;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:76px;
  }
  .rm-subnav-icon{font-size:19px; line-height:1;}
  .rm-nova-versao{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10070; background:#1f2329; color:#fff; display:flex; align-items:center; gap:10px; padding:10px 10px 10px 16px; box-shadow:0 8px 24px rgba(0,0,0,.3); font-size:14px; max-width:calc(100vw - 24px)}
  .rm-nova-versao button{border:0; background:#d9433a; color:#fff; font-weight:800; padding:8px 14px; font-family:inherit; cursor:pointer}
  .rm-nova-versao .x{background:none; font-size:20px; padding:0 4px}

  /* ===== Parafusos › Vender (toque / iPad) ===== */
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  /* tablet em pé (641 a 859 px): o menu de cima rola para o lado em vez de alargar a página inteira */
  @media (min-width:641px) and (max-width:859px){
    .rm-header{flex-wrap:wrap} .rm-header-right{min-width:0; flex:1 1 100%; max-width:100%}
    .rm-header-right .rm-nav{min-width:0; max-width:100%; flex:1 1 100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
  }
  /* no Safari do iPad o botão ocupa o tamanho do texto: força cada coluna a caber no espaço dela */
  .ip, .ip *, .ipt-w, .ipt-w *{box-sizing:border-box}
  .ip-pad, .ip-card, .ip-ces{min-width:0; overflow:hidden}
  .ip-kp, .ip-modo, .ip-alt, .ip-rap{width:100%}
  .ip-kp > button, .ip-modo > button, .ip-alt > button, .ip-rap > button, .ip-it .st > button, .ip-mv > button, .ipt > button, .ipm > button{min-width:0; width:100%; padding:0 2px; margin:0; overflow:hidden; -webkit-appearance:none; appearance:none; border-radius:0; line-height:1.1}
  .ip-mv > button{width:96px} .ip-it .st > button{width:48px}
  .ip-alt > button{padding:10px 4px; white-space:normal}
  .ip{display:grid; grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,330px); gap:14px; align-items:start; -webkit-user-select:none; user-select:none}
  .ip button, .ipt button, .ipm button, .ip-volta{touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer}
  .ip button:active, .ipt button:active, .ipm button:active{transform:scale(.97)}
  .ip-h{margin-bottom:10px}
  .ip-pad{background:var(--rm-panel); border:1px solid var(--rm-border); padding:12px; position:sticky; top:10px}
  .ip-modo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:10px} .ip-modo button{padding:12px 6px; font-weight:800; font-size:15px; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text-dim); font-family:inherit}
  .ip-modo button.on{background:var(--rm-text); color:var(--rm-panel); border-color:var(--rm-text)} .ip-modo button:disabled{opacity:.45; cursor:default}
  .ip-vis{border:3px solid var(--rm-text); background:var(--rm-bg); padding:6px 14px; text-align:right; font-size:56px; font-weight:900; line-height:1.1; min-height:72px; margin-bottom:10px; letter-spacing:.02em; overflow:hidden}
  .ip-vis.qtd{border-color:#2e6fd0} .ip-vis small{display:block; text-align:left; font-size:12px; font-weight:700; color:var(--rm-text-dim); letter-spacing:.05em; text-transform:uppercase} .ip-vis.qtd small{color:#2e6fd0}
  .ip-ph{color:var(--rm-border)}
  .ip-kp{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px} .ip-kp button{height:74px; font-size:32px; font-weight:800; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); font-family:inherit}
  .ip-kp .ok{background:#2e8b57; color:#fff; border-color:#2e8b57; font-size:22px} .ip-kp .ok.add{font-size:34px} .ip-kp .del{font-size:26px}
  .ip-alt{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px} .ip-alt button{padding:14px 6px; font-weight:800; font-size:14.5px; border:1px solid var(--rm-border); background:var(--rm-panel); color:var(--rm-text); font-family:inherit}
  .ip-card{background:var(--rm-panel); border:1px solid var(--rm-border); padding:16px; min-width:0}
  .ip-vazio{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:30px 12px; color:var(--rm-text-dim); font-size:15px; line-height:1.5}
  .ip-vazio b{font-size:20px; color:var(--rm-text)} .ip-vazio-i{font-size:46px}
  .ip-top{display:flex; gap:16px} .ip-dados{min-width:0}
  .ip-foto{width:230px; height:230px; object-fit:contain; background:#fff; border:1px solid var(--rm-border); flex-shrink:0; font-size:60px}
  .ip-cx{display:inline-block; background:#d9433a; color:#fff; font-weight:900; font-size:clamp(17px,1.7vw,24px); padding:6px 14px; white-space:nowrap}
  .ip-tipo{font-size:15px; color:var(--rm-text-dim); margin:10px 0 2px} .ip-med{font-size:46px; font-weight:900; line-height:1.05; overflow-wrap:break-word}
  .ip-inf{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:13px; color:var(--rm-text-dim)} .ip-inf b{display:block; font-size:24px; color:var(--rm-text); white-space:nowrap}
  .ip-q{display:flex; align-items:stretch; gap:10px; margin-top:16px} .ip-q > button{width:84px; height:84px; flex-shrink:0; padding:0; -webkit-appearance:none; appearance:none; border-radius:0; font-size:40px; font-weight:800; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); font-family:inherit}
  .ip-q .v{flex:1; min-width:0; border:3px solid var(--rm-border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:40px; font-weight:900; background:var(--rm-panel); cursor:pointer}
  .ip-q .v.on{border-color:#2e6fd0} .ip-q .v small{font-size:11px; font-weight:700; color:#2e6fd0; letter-spacing:.05em}
  .ip-rap{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-top:10px} .ip-rap button{height:58px; font-size:20px; font-weight:800; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); font-family:inherit}
  .ip-rap button.on{background:#2e6fd0; color:#fff; border-color:#2e6fd0}
  .ip-add{width:100%; -webkit-appearance:none; appearance:none; border-radius:0; padding:8px; min-height:80px; margin-top:14px; border:0; background:#2e8b57; color:#fff; font-size:23px; font-weight:900; font-family:inherit}
  .ip-ces{background:var(--rm-panel); border:1px solid var(--rm-border); padding:12px; display:flex; flex-direction:column; position:sticky; top:10px}
  .ip-ces h3{margin:0 0 8px; font-size:17px; display:flex; justify-content:space-between} .ip-ces h3 small{font-weight:600; color:var(--rm-text-dim); font-size:13px}
  .ip-it{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rm-border)}
  .ip-it > img, .ip-it > .pf-sf{width:44px; height:44px; object-fit:contain; background:#fff; border:1px solid var(--rm-border)} .ip-it b{font-size:14px; display:block} .ip-it small{font-size:12px; color:var(--rm-text-dim); display:block}
  .ip-it .cx{color:#d9433a; font-weight:900}
  .ip-it .st{grid-column:2 / 4; display:flex; align-items:center; gap:6px} .ip-it .st button{width:48px; height:44px; font-size:22px; font-weight:800; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); font-family:inherit}
  .ip-it .st span{min-width:44px; text-align:center; font-weight:900; font-size:17px} .ip-it .st .x{margin-left:auto; font-size:19px} .ip-it .vl{font-weight:900; font-size:15px}
  .ip-tot{display:flex; justify-content:space-between; font-size:26px; font-weight:900; margin:12px 0}
  .ip-ces .go{min-height:72px; border:0; background:#d9433a; color:#fff; font-size:20px; font-weight:900; font-family:inherit}
  .ip-ces .go2{min-height:60px; margin-top:8px; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); font-size:17px; font-weight:800; font-family:inherit}
  .ip-ces .go:disabled, .ip-ces .go2:disabled{opacity:.45; cursor:default}
  /* iPad: modo balcão */
  .pf-pin{width:340px} .pf-pin-tx{padding:4px 20px 0; font-size:14px; color:var(--rm-text-dim); text-align:center}
  .pf-pin-dots{display:flex; justify-content:center; gap:16px; padding:16px 0}
  .pf-pin-dots i{display:block; width:18px; height:18px; border-radius:50% !important; border:2px solid #1f2937} .pf-pin-dots i.on{background:#1f2937}
  .pf-pin-k{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 20px 20px}
  .pf-pin-k button{height:64px; font:inherit; font-size:26px; font-weight:800; border:1px solid var(--rm-border); background:var(--rm-bg); color:var(--rm-text); cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
  .pf-pin-k button:active{background:#1f2937; color:#fff} .pf-pin-k button.c{font-size:15px; font-weight:700}
  /* venda casada · parecidos · identificar · catálogo clientes */
  .pf-cmb{margin-top:14px; border:2px solid #2e8b57; background:#f1faf4; padding:10px 12px}
  .pf-cmb-t{font-weight:900; font-size:16px; margin-bottom:8px} .pf-cmb-t small{display:block; font-weight:600; font-size:12.5px; color:var(--rm-text-dim)}
  .pf-cmb-l{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px}
  .pf-cmb-l button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border:1px solid var(--rm-border); background:#fff; font-family:inherit; color:var(--rm-text); cursor:pointer; touch-action:manipulation}
  .pf-cmb-l button:disabled{opacity:.5} .pf-cmb-l img, .pf-cmb-l .pf-sf{width:46px; height:40px; object-fit:contain}
  .pf-cmb-l .n{font-size:11px; color:var(--rm-text-dim); text-align:center; line-height:1.15} .pf-cmb-l b{font-size:15px} .pf-cmb-l small{font-size:11px; color:var(--rm-text-dim)}
  .pf-cmb-l i{font-style:normal; margin-top:4px; background:#2e8b57; color:#fff; font-weight:900; padding:5px 0; width:100%; text-align:center}
  .pf-par{margin:10px 0; border:2px solid #e0a100; background:#fff8e1; padding:10px 12px} .pf-par-t{font-size:14px; margin-bottom:8px}

    .rm-header-right{ flex-direction:column; align-items:stretch; width:100%; gap:0; flex:1; min-height:0; flex-wrap:nowrap; }


    /* itens do menu: ícone + título + descrição, separados por linhas */
    .rm-nav{

      overflow-x:hidden; overflow-y:auto; order:1; border:none; border-top:1px solid var(--rm-border);

    .rm-sync-status, .rm-user-box{ flex-shrink:0; }

      border:none; border-bottom:1px solid var(--rm-border);

    .rm-nav-sub{ display:block; font-size:11.5px; font-weight:400; color:var(--rm-text-dim); margin-top:1px; }

    /* item ativo: bloco vermelho com ponta de seta à direita */
    .rm-nav-btn.active{
      background:var(--rm-accent); color:var(--rm-accent-ink); box-shadow:none;
      clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%);

      border-bottom-color:transparent;

    .rm-nav-btn.active .rm-nav-label{ font-weight:700; }
    .rm-nav-btn.active .rm-nav-sub{ color:rgba(255,255,255,0.92); }

    .rm-sync-status{ order:2; margin-top:auto; padding:0 14px 10px; }
    .rm-settings-wrap{ order:3; padding:0 14px 14px; }

function pfLabHash(t){ let h = 5381; for(let i = 0; i < t.length; i += 7) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36) + t.length.toString(36); }

// Enter desce para o mesmo campo da próxima linha (para preencher preços rápido)
function rmPfTabEnter(ev){
  if(ev.key !== 'Enter') return; ev.preventDefault();
  const td = ev.target.closest('td'), tr = td.closest('tr'), col = [...tr.children].indexOf(td);
  ev.target.blur();
  let prox = tr.nextElementSibling; while(prox && !(prox.children[col] && prox.children[col].querySelector('input'))) prox = prox.nextElementSibling;
  if(prox){ const i = prox.children[col].querySelector('input'); i.focus(); i.select(); }
}
function rmPfSalvarCampo(id, campo, valor){
  const prods = rmLoadProdutos(), p = prods.find(x => x.id === id); if(!p) return;
  const v = Math.max(0, rmParseMoeda(valor));
  if(campo === 'preco'){
    const antes = rmPfPreco(p); if(Math.abs(antes - v) < 0.0001) return;
    const parcIgual = !(Number(p.precoParceiro) > 0) || Math.abs(Number(p.precoParceiro) - antes) < 0.0001;
    p.precoConsumidor = v; if(parcIgual) p.precoParceiro = v;
    rmLog('Mudou preço do parafuso', 'CX ' + p.parafuso.cx + ' · ' + p.nome, rmFormatMoeda(antes) + ' → ' + rmFormatMoeda(v));
  } else {
    const antes = Number(p.estoqueAtual) || 0; if(Math.abs(antes - v) < 0.0001) return;
    p.estoqueAtual = v;
    rmLog('Ajustou estoque do parafuso', 'CX ' + p.parafuso.cx + ' · ' + p.nome, rmFmtQtd(antes) + ' → ' + rmFmtQtd(v));
  }
  rmSaveProdutos(prods); rmDbUpsertProduto(p);
  rmShowToast('CX ' + p.parafuso.cx + ' salvo');
}

  const v = await rmPerguntar(`Preço por unidade para ${sem.length ? 'os ' + sem.length + ' parafuso(s) SEM PREÇO' : 'os ' + l.length + ' parafuso(s)'} da lista filtrada:\n(ex.: 0,35)`, { titulo: 'Preço em lote', numero: true, placeholder: '0,00', sim: 'Continuar' });
  if(v == null) return;
  const n = rmParseMoeda(v); if(!(n > 0)){ alert('Preço inválido.'); return; }
  const alvo = sem.length ? sem : l;
  if(!(await rmConfirmar('Colocar ' + rmFormatMoeda(n) + ' em ' + alvo.length + ' parafuso(s)?', { titulo: 'Colocar preço?', sim: 'Colocar' }))) return;

  alvo.forEach(a => { const p = idx.get(a.id); if(!p) return; p.precoConsumidor = n; if(!(Number(p.precoParceiro) > 0)) p.precoParceiro = n; rmDbUpsertProduto(p); });
  rmSaveProdutos(prods);
  rmLog('Preço em lote nos parafusos', alvo.length + ' item(ns)', rmFormatMoeda(n) + ' · CX ' + alvo.map(p => p.parafuso.cx).join(', ').slice(0, 800));
  rmShowToast('Preço colocado em ' + alvo.length + ' parafuso(s)'); rmPfRenderEstoque();
}

function rmPfTipoEscolhido(v){

function rmPfFotoEscolher(inp){
  const f = inp.files && inp.files[0]; if(!f) return;

  const r = new FileReader(); r.onload = e => { document.getElementById('rm-pf-ed-fv').innerHTML = `<img class="pf-ed-img" src="${e.target.result}" alt="">`; }; r.readAsDataURL(f);
}
async function rmPfSalvarEdicao(id){
  const g = k => (document.getElementById('rm-pf-ed-' + k) || {}).value || '';
  const cx = parseInt(g('cx'), 10), tipo = g('tipo').trim(), med = g('med').trim().toUpperCase().replace(/(\d)\.(\d)/g, '$1,$2');
  if(!(cx > 0)){ alert('Informe o número da caixinha.'); return; }
  if(!tipo){ alert('Informe o tipo do parafuso.'); return; }
  if(!med){ alert('Informe a medida.'); return; }
  if(!await rmPfColunaOk()){ alert('Falta rodar no Supabase o arquivo parafusos-supabase.sql (ele só acrescenta a coluna "parafuso" nos produtos). Depois disso o cadastro funciona.'); return; }
  const prods = rmLoadProdutos();
  const outro = prods.find(x => x.parafuso && Number(x.parafuso.cx) === cx && x.id !== id);
  if(outro && !(await rmConfirmar(`A caixinha ${cx} já é do parafuso "${outro.nome}".\nUsar o mesmo número mesmo assim? (o certo é cada caixinha ter um número só)`, { tipo: 'aviso', titulo: 'Caixinha repetida', sim: 'Usar assim' }))) return;
  const bt = document.getElementById('rm-pf-ed-ok'); if(bt){ bt.disabled = true; bt.textContent = 'Salvando...'; }
  let fotoUrl;
  if(rmPfFotoNova && rmPfFotoNova.file){ fotoUrl = await rmUploadFotoProduto(rmPfFotoNova.file, id || 'pf'); if(!fotoUrl){ alert('Não consegui enviar a foto (sem internet?). O parafuso será salvo sem trocar a foto.'); } }
  else if(rmPfFotoNova && rmPfFotoNova.url) fotoUrl = rmPfFotoNova.url;
  let p = id ? prods.find(x => x.id === id) : null; const novo = !p;
  if(novo){ p = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 5), criadoEm: new Date().toISOString(), codigo: '', marca: '', categoria: 'PARAFUSOS', ativo: true }; prods.unshift(p); }
  const antes = novo ? null : JSON.stringify({ c: p.parafuso, pr: p.precoConsumidor, e: p.estoqueAtual });
  const pr = rmParseMoeda(g('pr')), estNovo = rmParseMoeda(g('est'));
  const parcIgual = !(Number(p.precoParceiro) > 0) || Math.abs(Number(p.precoParceiro) - rmPfPreco(p)) < 0.0001;
  p.parafuso = { cx, cat: g('cat').trim(), tipo, med, mais: !!(document.getElementById('rm-pf-ed-mais') || {}).checked };
  p.nome = (tipo + ' ' + med).toUpperCase();
  p.categoria = p.categoria || 'PARAFUSOS'; p.subcategoria = p.parafuso.cat;
  p.localizacao = 'CX ' + cx; p.aplicacao = g('apl').trim(); p.unidade = (g('un').trim() || 'UN').toUpperCase();
  p.precoConsumidor = pr; if(parcIgual) p.precoParceiro = pr;
  p.precoCusto = rmParseMoeda(g('cu')); p.estoqueMinimo = rmParseMoeda(g('min'));
  p.estoqueAtual = estNovo; p.ativo = !!(document.getElementById('rm-pf-ed-at') || {}).checked;
  if(fotoUrl) p.fotoUrl = fotoUrl;
  rmSaveProdutos(prods); rmDbUpsertProduto(p);
  rmLog(novo ? 'Cadastrou parafuso' : 'Editou parafuso', 'CX ' + cx + ' · ' + p.nome, novo ? rmFormatMoeda(pr) + ' · estoque ' + rmFmtQtd(estNovo) : antes + ' → ' + JSON.stringify({ c: p.parafuso, pr: p.precoConsumidor, e: p.estoqueAtual }));
  rmCloseModal(); rmShowToast(novo ? 'Parafuso cadastrado · CX ' + cx : 'Parafuso salvo'); rmPfRender();
}
async function rmPfColunaOk(){
  if(rmPfColOk === true) return true;
  if(navigator.onLine === false) return rmPfColOk !== false;
  try{ const r = await rmSb.from('produtos').select('id,parafuso').limit(1); rmPfColOk = !(r && r.error && /parafuso/i.test(String(r.error.message || r.error))); }
  catch(e){ return true; }
  return rmPfColOk;
}

function rmPfMudarCx(id, v){

async function rmPfImportar(inp){
  const f = inp.files && inp.files[0]; inp.value = ''; if(!f) return;
  let d; try{ d = JSON.parse(await f.text()); }catch(e){ alert('Esse arquivo não é o catálogo de parafusos.'); return; }

  if(!novos.length){ alert('Esse catálogo já foi importado. Nada novo para trazer.'); return; }
  if(!(await rmConfirmar(`Importar ${novos.length} item(ns) do catálogo de parafusos?\n\nEles entram no estoque geral marcados como parafuso, com foto, na caixinha da planilha, SEM preço e com estoque zero.` + (novos.length < d.itens.length ? `\n(${d.itens.length - novos.length} já existiam e ficam como estão)` : ''), { titulo: 'Importar catálogo?', sim: 'Importar' }))) return;
  const ov = document.createElement('div'); ov.id = 'rm-pf-imp-ov'; ov.innerHTML = '<div><b>Importando parafusos...</b><span id="rm-pf-imp-tx">Enviando fotos</span><i><u id="rm-pf-imp-bar"></u></i></div>'; document.body.appendChild(ov);
  const prog = (t, f) => { const a = document.getElementById('rm-pf-imp-tx'), b = document.getElementById('rm-pf-imp-bar'); if(a) a.textContent = t; if(b) b.style.width = Math.round(f * 100) + '%'; };
  try{
    // 1) fotos (uma por tipo)
    const precisa = [...new Set(novos.map(i => i.foto).filter(Boolean))], urls = {};
    let k = 0;
    for(const h of precisa){
      const src = d.fotos && d.fotos[h]; k++; prog('Enviando fotos ' + k + ' de ' + precisa.length, k / precisa.length * 0.5);
      if(!src) continue;
      const blob = await (await fetch(src)).blob(), ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg'), path = 'parafusos/' + h + '.' + ext;
      let ok = false;
      for(let t = 0; t < 3 && !ok; t++){ const r = await rmSb.storage.from('produtos-fotos').upload(path, blob, { contentType: blob.type || 'image/png', upsert: true }); ok = !(r && r.error); if(!ok) await rmEspera(1000); }
      if(ok) urls[h] = rmSb.storage.from('produtos-fotos').getPublicUrl(path).data.publicUrl;
    }
    // 2) produtos
    const agora = new Date().toISOString();
    const lista = novos.map(i => ({ id: 'pfcx' + i.cx, nome: (i.tipo + ' ' + i.med).toUpperCase(), codigo: '', codigoBarras: '', marca: '', aplicacao: i.apl || '', curva: '', categoria: 'PARAFUSOS', subcategoria: i.cat || '',
      localizacao: 'CX ' + i.cx, precoCusto: 0, precoConsumidor: 0, precoParceiro: 0, estoqueAtual: 0, estoqueMinimo: 0, estoqueMaximo: 0, unidade: 'UN', ehServico: false, observacao: '',
      fotoUrl: (i.foto && urls[i.foto]) || null, ativo: true, criadoEm: agora, parafuso: { cx: i.cx, cat: i.cat || '', tipo: i.tipo || '', med: i.med || '', mais: !!i.mais } }));
    for(let a = 0; a < lista.length; a += 100){
      prog('Gravando parafusos ' + Math.min(a + 100, lista.length) + ' de ' + lista.length, 0.5 + (a + 100) / lista.length * 0.5);
      let ok = false, err;
      for(let t = 0; t < 4 && !ok; t++){ const { error } = await rmUpsertDireto('produtos', lista.slice(a, a + 100).map(rmToDbRowProduto)); ok = !error; err = error; if(!ok) await rmEspera(1500); }
      if(!ok) throw err || new Error('falha ao gravar');
      const atual = rmLoadProdutos(), tem = new Set(atual.map(p => p.id));
      rmSaveProdutos(lista.slice(a, a + 100).filter(p => !tem.has(p.id)).concat(atual));
    }
    rmLog('Importou catálogo de parafusos', lista.length + ' item(ns)', Object.keys(urls).length + ' foto(s)');
    ov.remove();
    alert(lista.length + ' parafuso(s) importado(s)!\n\nAgora coloque os preços em Parafusos → Estoque (dá para digitar direto na tabela, ou usar "Preço em lote").');
    rmSetViewPf('estoque');
  }catch(e){
    console.error(e); ov.remove();
    alert('A importação parou no meio (' + (e && e.message || e) + ').\nVerifique a internet e clique em Importar de novo: o que já entrou não duplica.');
    rmPfRender();
  }
}

<script>
// ===== iPAD: fotos no aparelho · modo balcão =====

// ---------- 1) FOTOS GUARDADAS NO APARELHO (funcionam sem internet) ----------
// Na 1ª vez que tem internet, baixa cada foto uma vez e guarda no IndexedDB do aparelho.
// Depois disso as fotos aparecem mesmo com o Wi-Fi caído.
const rmPfFotoCache = new Map();   // url do servidor → endereço local (blob:)
let rmPfFotoDb = null, rmPfFotoBaixando = false;
function rmPfFotoDbAbrir(){
  if(rmPfFotoDb) return rmPfFotoDb;
  rmPfFotoDb = new Promise(res => {
    try{ const rq = indexedDB.open('radicalMotos_pfFotos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('f');
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
  return rmPfFotoDb;
}
function rmPfFotoDbOp(modo, fn){ return rmPfFotoDbAbrir().then(db => db ? new Promise(res => { try{ const t = db.transaction('f', modo), r = fn(t.objectStore('f')); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); }catch(e){ res(null); } }) : null); }
// troca o endereço da foto pelo local, se já estiver guardada
function rmPfFotoSrc(url){ return rmPfFotoCache.get(url) || url; }
async function rmPfFotosPreparar(){
  if(rmPfFotoBaixando) return; rmPfFotoBaixando = true;
  try{
    const db = await rmPfFotoDbAbrir(); if(!db) return;
    const urls = [...new Set(rmLoadProdutos().filter(p => p.parafuso && p.fotoUrl && /^https?:/.test(p.fotoUrl)).map(p => p.fotoUrl))];
    const chaves = new Set(await rmPfFotoDbOp('readonly', s => s.getAllKeys()) || []);
    // carrega as que já estão no aparelho
    for(const u of urls) if(chaves.has(u) && !rmPfFotoCache.has(u)){
      const blob = await rmPfFotoDbOp('readonly', s => s.get(u)); if(blob) rmPfFotoCache.set(u, URL.createObjectURL(blob));
    }
    let novas = 0;
    const falta = urls.filter(u => !chaves.has(u));
    if(falta.length && navigator.onLine !== false){
      let i = 0;
      const trab = async () => { while(i < falta.length){ const u = falta[i++];
        try{ const r = await fetch(u, { mode: 'cors' }); if(!r.ok) continue; const blob = await r.blob(); if(!blob.size) continue;
          await rmPfFotoDbOp('readwrite', s => s.put(blob, u)); rmPfFotoCache.set(u, URL.createObjectURL(blob)); novas++;
        }catch(e){} } };
      await Promise.all([trab(), trab(), trab(), trab()]);
    }
    if(rmPfFotoCache.size){ try{ rmPfRender(); }catch(e){} }
    if(novas) rmShowToast(novas + ' foto(s) guardada(s) no aparelho');
  } finally { rmPfFotoBaixando = false; }
}
// apaga do aparelho as fotos que nenhum parafuso usa mais
async function rmPfFotosLimpar(){
  const usadas = new Set(rmLoadProdutos().map(p => p.fotoUrl).filter(Boolean));
  const chaves = await rmPfFotoDbOp('readonly', s => s.getAllKeys()) || [];
  for(const k of chaves) if(!usadas.has(k)) await rmPfFotoDbOp('readwrite', s => s.delete(k));
}
window.addEventListener('online', () => rmPfFotosPreparar());

// ---------- 3) MODO BALCÃO (iPad do vendedor) ----------
// Liga por aparelho. Mostra só Vender, Expositor, Catálogo e Noções; ninguém edita preço/estoque.
// Para sair pede a senha de 4 números criada ao ligar.
const RM_PF_BALCAO_KEY = 'radicalMotos_pfBalcao', RM_PF_BALCAO_SUBS = ['vender', 'expositor', 'catalogo', 'nocoes'];
function rmPfBalcaoLigado(){ try{ return !!localStorage.getItem(RM_PF_BALCAO_KEY); }catch(e){ return false; } }
function rmPfBalcaoAplicar(){ document.body.classList.toggle('pf-balcao', rmPfBalcaoLigado()); }
// teclado de senha só com números (no iPad não abre o teclado do sistema)
function rmPfSenhaPad(o){
  return new Promise(res => {
    let v = '';
    const ov = document.createElement('div'); ov.className = 'dg-ov';
    ov.innerHTML = `<div class="dg dg-info pf-pin" role="dialog" aria-modal="true">
      <div class="dg-cab"><div class="dg-ic">&#128274;</div><div class="dg-cabtx"><div class="dg-tit">${rmEscapeHtml(o.titulo || 'Senha')}</div></div></div>
      <div class="pf-pin-tx">${rmEscapeHtml(o.texto || '').replace(/\n/g, '<br>')}</div>
      <div class="pf-pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="pf-pin-k">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="x" class="c">Cancelar</button><button type="button" data-k="0">0</button><button type="button" data-k="b" class="c">&#9003;</button></div>
    </div>`;
    const fim = r => { document.removeEventListener('keydown', tecla, true); ov.remove(); res(r); };
    const pinta = () => ov.querySelectorAll('.pf-pin-dots i').forEach((d, i) => d.classList.toggle('on', i < v.length));
    const aperta = k => {
      if(k === 'x') return fim(null);
      if(k === 'b'){ v = v.slice(0, -1); pinta(); return; }
      if(v.length >= 4) return;
      v += k; pinta();
      if(v.length === 4) setTimeout(() => fim(v), 160);
    };
    const tecla = e => { if(/^[0-9]$/.test(e.key)) aperta(e.key); else if(e.key === 'Backspace') aperta('b'); else if(e.key === 'Escape') aperta('x'); else return; e.preventDefault(); e.stopPropagation(); };
    ov.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if(b) aperta(b.dataset.k); });
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
  });
}

<script>
// ===== BALCÃO: venda casada · medida mais próxima · identificar parafuso · catálogo para clientes =====

// ---------- medidas em mm (diâmetro e comprimento) ----------
function rmPfPartes(p){ return String((p && p.parafuso && p.parafuso.med) || '').toUpperCase().replace(/\s+/g, '').split('X'); }
function rmPfEhPol(s){ return /\/|"/.test(s); }
// diâmetro em mm: "M8X1,25" → 8 · "5/16" → 7,94 · "4,5X16" → 4,5 · "1"" → 25,4
function rmPfDiamMm(p){
  const a = rmPfPartes(p)[0] || ''; if(!/^M?\d/.test(a)) return null;
  const v = rmPfNum(a); if(!(v > 0) || v === 9999) return null;
  return rmPfEhPol(a) ? v * 25.4 : v;
}
// comprimento em mm: "8X40" → 40 · "3/8X2" → 50,8 · "5,5X3/4" → 19 · "1/4X100" (soberba) → 100
function rmPfCompMm(p){
  const x = rmPfPartes(p); if(x.length < 2 || !x[1]) return null;
  const s = x[1], v = rmPfNum(s); if(!(v > 0) || v === 9999) return null;
  if(rmPfEhPol(s)) return v * 25.4;
  if(rmPfPolegada(p) && !/soberba|cama|telha/i.test(p.parafuso.tipo || '') && v < 13) return v * 25.4;
  return v;
}
const rmPfEst = p => Number(p && p.estoqueAtual) || 0;
const rmPfMmTxt = v => (Math.round(v * 10) / 10).toString().replace('.', ',') + ' mm';

// ---------- 1) VENDA CASADA ----------
// Depois de adicionar um parafuso, sugere porca, arruelas ou bucha da mesma medida (um toque para adicionar).
let rmPfUltimo = null; // { pid, q } último parafuso que entrou na venda
const RM_PF_ROSCA_CATS = ['Parafuso Sextavado', 'Parafuso Allen', 'Parafuso Rosca Máquina', 'Parafuso Francês', 'Estojo Prisioneiro', 'Barra Roscada'];
const RM_PF_BUCHA_CATS = ['Parafuso Chipboard', 'Parafuso Autoatarraxante', 'Parafuso para Madeira', 'Parafuso Tampinha'];
function rmPfMaisPerto(lista, d, tol){
  let best = null, bd = Infinity;
  lista.forEach(x => { const xd = rmPfDiamMm(x); if(xd == null) return; const dd = Math.abs(xd - d); if(dd <= tol && dd < bd){ bd = dd; best = x; } });
  return best;
}
function rmPfCombina(p){
  if(!p || !p.parafuso) return [];
  const pf = p.parafuso, tipo = pf.tipo || '', d = rmPfDiamMm(p); if(d == null) return [];
  const todos = rmPfLista().filter(x => x.ativo !== false && x.id !== p.id), doTipo = t => todos.filter(x => (x.parafuso.tipo || '') === t);
  const out = [];
  if(RM_PF_ROSCA_CATS.includes(pf.cat) && !/soberba/i.test(tipo)){
    const inox = /inox/i.test(tipo), pol = rmPfPolegada(p);
    const porca = inox ? doTipo('Porca Milímetro E Polegada Inox') : doTipo(pol ? 'Porca Sextavada Polegada Unc' : 'Porca Sextavada Milímetro');
    const trava = inox ? doTipo('Porca Milímetro E Polegada Inox Travante') : doTipo(pol ? 'Porca Sextavada Travante Parlock Polegada Unc' : 'Porca Sextavada Travante Parlock Milímetro');
    const lisa = inox ? doTipo('Arruela Lisa Milímetro E Polegada Aço Inox') : doTipo('Arruela Lisa Polegada Zincado Branco');
    out.push(rmPfMaisPerto(porca, d, 0.4), rmPfMaisPerto(trava, d, 0.4), rmPfMaisPerto(lisa, d, 0.9), rmPfMaisPerto(doTipo('Arruela Pressão'), d, 0.9));
    if(pf.cat === 'Barra Roscada') out.push(rmPfMaisPerto(doTipo('Porca Prolongador'), d, 0.4));
  } else if(RM_PF_BUCHA_CATS.includes(pf.cat)){
    const b = d <= 3.6 ? '5' : d <= 4.5 ? '6' : d <= 5.5 ? '8' : '10';
    out.push(todos.find(x => x.parafuso.tipo === 'Bucha De Fixação Parede - Comum' && x.parafuso.med === b), todos.find(x => x.parafuso.tipo === 'Bucha De Fixação Parede - Com Anel' && x.parafuso.med === b));
  }
  const naCesta = new Set(rmPfCesta().map(i => i.pid));
  return out.filter((x, i, a) => x && !naCesta.has(x.id) && a.indexOf(x) === i);
}
function rmPfNomeCurto(t){ return String(t || '').replace(/^Parafuso /i, '').replace(/ Zincado Branco| Milímetro E Polegada| Milímetro| Polegada Unc/gi, '').replace(/Sextavada Travante Parlock/i, 'Travante (parlock)').replace(/^Bucha De Fixação Parede - /i, 'Bucha '); }
function rmPfCombinaHtml(){
  if(!rmPfUltimo) return '';

  const l = rmPfCombina(p); if(!l.length) return '';

  return `<div class="pf-cmb"><div class="pf-cmb-t">Vai precisar também? <small>para o CX ${p.parafuso.cx} · ${rmEscapeHtml(rmPfMedTxt(p.parafuso.med))} (${rmFmtQtd(q)} un)</small></div>
    <div class="pf-cmb-l">${l.map(x => { const pr = rmPfPreco(x); return `<button type="button"${pr ? '' : ' disabled'} onclick="rmPfAddCombina('${rmJs(x.id)}')">${rmPfFotoHtml(x)}<span class="n">${rmEscapeHtml(rmPfNomeCurto(x.parafuso.tipo))}</span><b>${rmEscapeHtml(rmPfMedTxt(x.parafuso.med))}</b><small>CX ${x.parafuso.cx} · ${pr ? rmFormatMoeda(pr) : 'sem preço'}</small><i>${pr ? '+ ' + rmFmtQtd(q) : '—'}</i></button>`; }).join('')}</div></div>`;
}
function rmPfAddCombina(pid){
  const p = rmIdx(rmLoadProdutos()).get(pid); if(!p || !rmPfUltimo) return;
  if(!rmPfPreco(p)){ rmShowToast('Sem preço'); return; }
  const q = rmPfUltimo.q, l = rmPfCesta(), ex = l.find(i => i.pid === pid);
  if(ex) ex.q = (Number(ex.q) || 0) + q; else l.push({ pid, q });
  rmPfCestaGravar(l); rmShowToast('Adicionado: ' + rmFmtQtd(q) + ' × CX ' + p.parafuso.cx + ' ' + (p.parafuso.med || ''));
  rmPfRenderRes(); rmPfRenderCesta();
}

// ---------- 2) MEDIDA MAIS PRÓXIMA ----------
// Quando a caixinha está sem estoque, mostra as medidas parecidas do mesmo tipo que TÊM estoque.
function rmPfParecidos(p, n){
  const d = rmPfDiamMm(p), c = rmPfCompMm(p); if(d == null) return [];
  return rmPfLista().filter(x => x.id !== p.id && x.ativo !== false && (x.parafuso.tipo || '') === (p.parafuso.tipo || '') && rmPfEst(x) > 0)
    .map(x => { const xd = rmPfDiamMm(x), xc = rmPfCompMm(x); if(xd == null) return null;
      const s = Math.abs(xd - d) / d * 4 + (c && xc ? Math.abs(xc - c) / c : 0); return { x, s, mesmoD: Math.abs(xd - d) < 0.05 }; })
    .filter(Boolean).sort((a, b) => a.s - b.s).slice(0, n || 4);
}
function rmPfParecidosHtml(p){
  if(rmPfEst(p) > 0) return '';
  const l = rmPfParecidos(p, 4); if(!l.length) return '';
  const c = rmPfCompMm(p);
  return `<div class="pf-par"><div class="pf-par-t">&#9888;&#65039; Sem estoque desta medida. <b>Parecidos que tem na loja:</b></div><div class="pf-par-l">${l.map(({ x, mesmoD }) => {
    const xc = rmPfCompMm(x), dif = mesmoD && c && xc ? (xc > c ? '+' : '−') + rmFmtNum(Math.abs(xc - c)).replace(/,00$/, '') + ' mm mais ' + (xc > c ? 'comprido' : 'curto') : 'outro diâmetro';
    return `<button type="button" onclick="rmPfVenderCx(${x.parafuso.cx})"><b>${rmEscapeHtml(rmPfMedTxt(x.parafuso.med))}</b><small>CX ${x.parafuso.cx} · ${rmFmtQtd(rmPfEst(x))} un</small><i>${dif}</i></button>`; }).join('')}</div></div>`;
}

// ---------- 3) IDENTIFICAR O PARAFUSO ----------
// O cliente chega com um parafuso na mão: o vendedor responde tipo → mm/polegada → diâmetro → comprimento.
const RM_PF_ID_GRUPOS = [
  { k: 'sext', t: 'Sextavado', ic: '&#11042;', cats: ['Parafuso Sextavado'] },
  { k: 'allen', t: 'Allen', ic: '&#9711;', cats: ['Parafuso Allen'] },
  { k: 'phil', t: 'Phillips / fenda', ic: '&#10010;', cats: ['Parafuso Rosca Máquina', 'Parafuso Chipboard', 'Parafuso Autoatarraxante', 'Parafuso para Madeira', 'Parafuso Auto Brocante', 'Parafuso Tampinha'] },
  { k: 'porca', t: 'Porca', ic: '&#11041;', cats: ['Porca'] },
  { k: 'arru', t: 'Arruela', ic: '&#9678;', cats: ['Arruela'] },
  { k: 'out', t: 'Outros', ic: '&#8230;', cats: null }
];
let rmPfId = { g: null, s: null, d: null, c: null };
function rmPfIdItens(ate){
  const g = RM_PF_ID_GRUPOS.find(x => x.k === rmPfId.g), todosCats = RM_PF_ID_GRUPOS.filter(x => x.cats).flatMap(x => x.cats);
  let l = rmPfLista().filter(p => p.ativo !== false && rmPfDiamMm(p) != null);
  if(g) l = l.filter(p => g.cats ? g.cats.includes(p.parafuso.cat) : !todosCats.includes(p.parafuso.cat));
  if(ate === 's') return l;
  if(rmPfId.s) l = l.filter(p => (rmPfId.s === 'pol') === rmPfPolegada(p));
  if(ate === 'd') return l;
  if(rmPfId.d != null) l = l.filter(p => Math.abs(rmPfDiamMm(p) - rmPfId.d) < 0.08);
  if(ate === 'c') return l;
  if(rmPfId.c != null) l = l.filter(p => { const c = rmPfCompMm(p); return c != null && Math.abs(c - rmPfId.c) < 0.6; });
  return l;
}
function rmPfIdSet(k, v){
  rmPfId[k] = rmPfId[k] === v ? null : v;
  const ordem = ['g', 's', 'd', 'c']; ordem.slice(ordem.indexOf(k) + 1).forEach(x => rmPfId[x] = null);
  rmPfRenderVender();
}
function rmPfRenderIdent(el){
  const id = rmPfId, chip = (k, v, txt, sub) => `<button type="button" class="${id[k] === v ? 'on' : ''}" onclick="rmPfIdSet('${k}', ${typeof v === 'string' ? `'${v}'` : v})">${txt}${sub ? `<small>${sub}</small>` : ''}</button>`;
  const lS = rmPfIdItens('s'), temMm = lS.some(p => !rmPfPolegada(p)), temPol = lS.some(rmPfPolegada);
  const lD = rmPfIdItens('d'), ds = new Map();
  lD.forEach(p => { const v = Math.round(rmPfDiamMm(p) * 10) / 10; if(!ds.has(v)){ const a = rmPfPartes(p)[0]; ds.set(v, rmPfEhPol(a) ? a.replace(/^M/, '') + '"' : 'M' + rmFmtNum(v).replace(/,0+$/, '')); } });
  const lC = id.d != null ? rmPfIdItens('c') : [], cs = new Map();
  lC.forEach(p => { const c = rmPfCompMm(p); if(c == null) return; const v = Math.round(c * 10) / 10; if(!cs.has(v)){ const b = rmPfPartes(p)[1]; cs.set(v, rmPfEhPol(b) || (rmPfPolegada(p) && rmPfNum(b) < 13 && !/soberba|cama|telha/i.test(p.parafuso.tipo)) ? b.replace(/^(\d)(\d\/\d+)$/, '$1.$2') + '"' : rmFmtNum(v).replace(/,0+$/, '') + ' mm'); } });
  const res = rmPfIdItens().sort((a, b) => rmPfDiamMm(a) - rmPfDiamMm(b) || (rmPfCompMm(a) || 0) - (rmPfCompMm(b) || 0));
  const passo = (n, t, dica, corpo, ok) => `<div class="pf-id-p${ok ? ' ok' : ''}"><div class="pf-id-n">${n}</div><div class="pf-id-c"><b>${t}</b>${dica ? `<span class="pf-id-d">${dica}</span>` : ''}<div class="pf-id-ch">${corpo}</div></div></div>`;
  el.innerHTML = `<div class="pf-h"><button type="button" class="ip-volta" onclick="rmPfVoltar()">&larr; Voltar</button><h1 class="rm-title" style="margin:0">Identificar o parafuso</h1><button type="button" class="pf-id-lp" onclick="rmPfId={g:null,s:null,d:null,c:null}; rmPfRenderVender()">Começar de novo</button></div>
    <div class="pf-id">
      <div class="pf-id-steps">
        ${passo(1, 'Que peça é?', 'olhe a cabeça do parafuso', RM_PF_ID_GRUPOS.map(g => chip('g', g.k, `<i>${g.ic}</i>${g.t}`)).join(''), id.g)}
        ${passo(2, 'Milímetro ou polegada?', 'polegada: diâmetros "quebrados" (6,35 · 7,94 · 9,52 mm) e rosca mais grossa. Na dúvida, compare com uma porca de cada.', (temMm ? chip('s', 'mm', 'Milímetro', 'M5, M6, M8, M10...') : '') + (temPol ? chip('s', 'pol', 'Polegada', '1/4, 5/16, 3/8...') : ''), id.s)}
        ${passo(3, 'Diâmetro (grossura da rosca)', 'meça a rosca por fora com o paquímetro', [...ds.entries()].sort((a, b) => a[0] - b[0]).map(([v, t]) => chip('d', v, t, /"/.test(t) ? rmPfMmTxt(v) : '')).join('') || '<span class="pf-id-v">—</span>', id.d != null)}
        ${id.d != null ? passo(4, 'Comprimento', 'meça do pé da cabeça até a ponta (cabeça chata/escareada: conta a cabeça junto)', [...cs.entries()].sort((a, b) => a[0] - b[0]).map(([v, t]) => chip('c', v, t)).join('') || '<span class="pf-id-v">sem comprimento (porca, arruela...)</span>', id.c != null) : ''}
      </div>
      <div class="pf-id-res"><div class="pf-id-rt">${res.length} caixinha${res.length === 1 ? '' : 's'} ${id.g || id.s || id.d != null ? 'com essas características' : 'na loja'}</div>
        <div class="pf-id-rl">${res.slice(0, 80).map(p => `<button type="button" class="${rmPfEst(p) <= 0 ? 'sem' : ''}" onclick="rmPfTela='principal'; rmPfVenderCx(${p.parafuso.cx})">${rmPfFotoHtml(p)}<div><small>${rmEscapeHtml(rmPfNomeCurto(p.parafuso.tipo))}</small><b>${rmEscapeHtml(rmPfMedTxt(p.parafuso.med))}</b></div><span>CX ${p.parafuso.cx}<small>${rmPfPreco(p) ? rmFormatMoeda(rmPfPreco(p)) : 'sem preço'}</small></span></button>`).join('')}
        ${res.length > 80 ? `<div class="pf-id-v">e mais ${res.length - 80}... responda mais uma pergunta para filtrar</div>` : ''}${!res.length ? '<div class="pf-id-v">Nenhuma caixinha com essa combinação.</div>' : ''}</div></div>
    </div>`;
}

*{box-sizing:border-box} body{margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f2f1ee; color:#222; padding-bottom:90px}
header{background:#1f2937; color:#fff; padding:16px 16px 12px; position:sticky; top:0; z-index:5}
header h1{margin:0; font-size:20px} header p{margin:2px 0 10px; color:#cbd5e1; font-size:13px}
#q{width:100%; font-size:16px; padding:12px 14px; border:0; border-radius:8px}
.fil{display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; margin:0 -2px}
.fil button{flex:none; border:1px solid #475569; background:#334155; color:#fff; border-radius:20px; padding:7px 12px; font-size:13px; font-weight:600}
.fil button.on{background:#d9433a; color:#fff; border-color:#d9433a}
main{max-width:1100px; margin:0 auto; padding:12px}
.fam{background:#fff; border:1px solid #ddd; margin-bottom:12px; border-radius:10px; overflow:hidden}
.ft{display:flex; gap:12px; padding:12px; align-items:center} .ft img,.ft .sf{width:72px; height:72px; object-fit:contain; flex:none; background:#fff; border:1px solid #eee; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:30px}
.ft small{color:#d9433a; font-weight:800; font-size:11px; text-transform:uppercase} .ft h2{margin:2px 0; font-size:16px} .ft p{margin:0; font-size:12.5px; color:#666}
.md{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:6px; padding:0 12px 12px}
.md button{border:1px solid #ddd; background:#fafafa; border-radius:8px; padding:8px 6px; text-align:center; font:inherit; cursor:pointer}
.md button b{display:block; font-size:15px} .md button span{display:block; font-size:12px; color:#2e8b57; font-weight:800} .md button em{display:block; font-style:normal; font-size:10.5px; color:#999}
.md button.in{border:2px solid #2e8b57; background:#eaf6ef}
.bar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #ccc; padding:10px 14px; display:none; gap:10px; align-items:center; box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar.show{display:flex} .bar div{flex:1; font-size:14px} .bar b{font-size:18px; display:block}
.bar button{border:0; background:#25d366; color:#fff; font-weight:800; font-size:16px; padding:14px 18px; border-radius:8px}
.lst{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:10} .lst.show{display:flex}
.lst > div{background:#fff; width:100%; max-width:560px; max-height:85vh; overflow:auto; border-radius:14px 14px 0 0; padding:16px}
.it{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #eee} .it div{flex:1} .it small{color:#777; display:block}
.it input{width:64px; font-size:16px; padding:6px; text-align:center} .it button{border:0; background:none; font-size:20px; color:#c00}
.ok{width:100%; border:0; background:#25d366; color:#fff; font-weight:800; font-size:17px; padding:15px; border-radius:8px; margin-top:12px}
.av{font-size:12px; color:#888; text-align:center; margin:16px 0}
</style></head><body>
<header><h1 id="loja"></h1><p>Parafusos, porcas e fixação · toque na medida para pôr na lista</p><input id="q" placeholder="Buscar: sextavado 8x40, allen m6, porca 5/16..." autocomplete="off"><div class="fil" id="fil"></div></header>
<main id="m"></main>
<p class="av" id="av"></p>
<div class="bar" id="bar"><div><span id="bn"></span><b id="bt"></b></div><button onclick="abrir()">Ver lista</button></div>
<div class="lst" id="lst" onclick="if(event.target===this) this.classList.remove('show')"><div><h2 style="margin:0 0 6px">Minha lista</h2><div id="ll"></div><button class="ok" onclick="enviar()">Enviar pedido pelo WhatsApp</button></div></div>
<script>
const D=${dados}, L={}; let cat='';
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=s=>String(s).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/\\s*x\\s*/g,'x');
document.getElementById('loja').textContent=D.loja;
document.getElementById('av').textContent=(D.preco?'Preços por unidade, sujeitos a alteração. ':'')+'Atualizado em '+D.em+'.';
const cats=[...new Set(D.f.map(f=>f.cat))];
document.getElementById('fil').innerHTML=['Todos',...cats].map((c,i)=>'<button data-c="'+(i?E(c):'')+'"'+(i?'':' class="on"')+'>'+E(c)+'</button>').join('');
document.getElementById('fil').onclick=e=>{const b=e.target.closest('button'); if(!b) return; cat=b.dataset.c; document.querySelectorAll('.fil button').forEach(x=>x.classList.toggle('on',x===b)); desenha();};
document.getElementById('q').oninput=desenha;
function desenha(){
  const t=N(document.getElementById('q').value).split(' ').filter(Boolean);
  document.getElementById('m').innerHTML=D.f.filter(f=>!cat||f.cat===cat).map((f,fi)=>{
    const base=N(f.t+' '+f.cat), it=f.i.filter(i=>t.every(w=>(base+' '+N(i.m)+' cx'+i.cx).includes(w)));
    if(!it.length) return '';
    return '<div class="fam"><div class="ft">'+(f.foto?'<img src="'+E(f.foto)+'" loading="lazy" onerror="this.outerHTML=\\'<div class=sf>🔩</div>\\'">':'<div class="sf">🔩</div>')+'<div><small>'+E(f.cat)+'</small><h2>'+E(f.t)+'</h2>'+(f.apl?'<p>'+E(f.apl.length>140?f.apl.slice(0,140)+'…':f.apl)+'</p>':'')+'</div></div><div class="md">'+
      it.map(i=>'<button class="'+(L[i.cx]?'in':'')+'" onclick="poe('+fi+','+i.cx+')"><b>'+E(i.m.replace(/X/g,' × '))+'</b>'+(D.preco&&i.p?'<span>'+R(i.p)+'</span>':'')+'<em>'+(L[i.cx]?L[i.cx].q+' na lista':'CX '+i.cx)+'</em></button>').join('')+'</div></div>';
  }).join('')||'<p style="text-align:center;color:#888;padding:30px">Nada encontrado.</p>';
  barra();
}
function poe(fi,cx){ const f=D.f[fi], i=f.i.find(x=>x.cx===cx); const q=prompt('Quantas unidades de '+f.t+' '+i.m+'?', L[cx]?L[cx].q:10); if(q===null) return; const n=parseInt(q,10); if(n>0) L[cx]={t:f.t,m:i.m,p:i.p,q:n}; else delete L[cx]; desenha(); }
function barra(){ const k=Object.keys(L), tot=k.reduce((s,c)=>s+L[c].p*L[c].q,0); document.getElementById('bar').classList.toggle('show',k.length>0);
  document.getElementById('bn').textContent=k.length+(k.length===1?' item na lista':' itens na lista'); document.getElementById('bt').textContent=D.preco?R(tot):''; }
function abrir(){ const k=Object.keys(L); document.getElementById('ll').innerHTML=k.map(c=>'<div class="it"><div><b>'+E(L[c].m.replace(/X/g,' × '))+'</b><small>'+E(L[c].t)+' · CX '+c+(D.preco&&L[c].p?' · '+R(L[c].p)+' un':'')+'</small></div><input type="number" min="1" value="'+L[c].q+'" onchange="L['+c+'].q=Math.max(1,parseInt(this.value,10)||1); barra()"><button onclick="delete L['+c+']; abrir(); desenha()">🗑</button></div>').join(''); document.getElementById('lst').classList.toggle('show',k.length>0); }
function enviar(){ const k=Object.keys(L); if(!k.length) return; let tot=0;
  const tx='Olá! Quero estes itens:\\n'+k.map(c=>{const x=L[c]; tot+=x.p*x.q; return '• '+x.q+' un — CX '+c+' — '+x.t+' '+x.m.replace(/X/g,'x')+(D.preco&&x.p?' ('+R(x.p)+' un)':'');}).join('\\n')+(D.preco?'\\n\\nTotal aproximado: '+R(tot):'');
  if(!D.wa){ alert('A loja não informou o WhatsApp. Copie a lista:\\n\\n'+tx); return; }
  location.href='https://wa.me/'+D.wa+'?text='+encodeURIComponent(tx); }
desenha();
<\/script></body></html>`;
}
</script>
<script>
// avisos no padrão do sistema (igual ao ERP)
window.alert = function(msg){ if(rmDlgNativo()) return rmAlertNativo(msg); rmAlerta(msg); };
// ===== botões do laboratório =====
function labConta(){ const n = rmLoadProdutos().filter(p => p.parafuso).length; const el = document.getElementById('lab-n'); if(el) el.textContent = n + ' parafuso(s)'; }
async function labImportar(inp){
  const f = inp.files && inp.files[0]; inp.value = ''; if(!f) return;
  let d; try{ d = JSON.parse(await f.text()); }catch(e){ rmAlerta('Não consegui ler esse arquivo.'); return; }
  const rows = d && d.tabelas && Array.isArray(d.tabelas.produtos) ? d.tabelas.produtos : null;
  if(!rows){ rmAlerta('Esse arquivo não é um backup do ERP (backup-radical-motos-....json).'); return; }
  const pf = rows.filter(r => r.parafuso && r.parafuso.cx != null).map(rmFromDbRowProduto);
  if(!pf.length){ rmAlerta('Esse backup não tem nenhum parafuso cadastrado.'); return; }
  if(rmLoadProdutos().length && !(await rmConfirmar('Trocar os parafusos do laboratório pelos ' + pf.length + ' do backup?\n\n(O ERP não muda nada.)', { titulo: 'Puxar do backup', sim: 'Trocar' }))) return;
  rmSaveProdutos(pf); rmLog('Puxou parafusos do backup', f.name, pf.length + ' item(ns)'); labConta(); rmPfRender(); rmShowToast(pf.length + ' parafuso(s) carregados');
}
function labBaixar(){
  const l = rmLoadProdutos().filter(p => p.parafuso);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ formato: 'radical-parafusos-lab', em: new Date().toISOString(), produtos: l }, null, 1)], { type: 'application/json' }));
  a.download = 'parafusos-laboratorio.json'; document.body.appendChild(a); a.click(); a.remove();
}
function labRegistro(){
  const l = rmStoreLer('log').slice(0, 60);
  rmAlerta(l.length ? l.map(x => new Date(x.em).toLocaleString('pt-BR').slice(0, 17) + ' · ' + x.acao + (x.ref ? ' · ' + x.ref : '') + (x.det ? ' · ' + x.det : '')).join('\n') : 'Nada ainda.', { titulo: 'Registro do laboratório' });
}
async function labZerar(){
  if(!(await rmConfirmar('Apagar tudo do laboratório neste navegador e voltar aos parafusos padrão?\n\n(O ERP não muda nada.)', { tipo: 'perigo', titulo: 'Zerar laboratório', sim: 'Zerar' }))) return;
  Object.keys(localStorage).filter(k => k.startsWith(PF_LAB)).forEach(k => localStorage.removeItem(k)); pfLabFotoMapa = null; labPadrao(); labConta(); rmPfRender();
}
// carrega os parafusos padrão quando o laboratório está vazio (primeira vez ou depois de zerar)
// se a lista padrão do arquivo mudou (nova versão), troca a do navegador sozinho
function labPadrao(){
  const s = JSON.stringify(PF_LAB_PADRAO); let h = 5381; for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  const versao = h.toString(36) + s.length.toString(36), antes = localStorage.getItem(PF_LAB + 'versao');
  if(localStorage.getItem(PF_LAB + RM_PRODUTOS_KEY) === null || antes !== versao){
    rmSaveProdutos(PF_LAB_PADRAO.map(rmFromDbRowProduto)); localStorage.setItem(PF_LAB + 'versao', versao);
    if(antes){ rmLog('Lista padrão atualizada', '', PF_LAB_PADRAO.length + ' item(ns)'); setTimeout(() => rmShowToast('Lista de parafusos atualizada'), 300); }
  }
}
{ const _s = rmSaveProdutos; rmSaveProdutos = function(l){ _s(l); setTimeout(labConta, 0); }; }
labPadrao(); labConta(); rmSetViewPf('vender');
</script>
